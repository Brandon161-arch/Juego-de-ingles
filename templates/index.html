<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#241238">
<title>Robo Runner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Russo+One&display=swap" rel="stylesheet">
<style>
  :root {
    --cielo1: #3d1f6e;
    --cielo2: #c94f6d;
    --cielo3: #ff9f5a;
    --sol: #fff6cc;
    --solHalo: #ffab4d;
    --estrella: 0.35;
    --nube: #ffd9c4;
    --montana: #7a4f8f;
    --montana2: #5b3a72;
    --ciudad: #4a3168;
    --ventana: #ffd27a;
    --ventana2: #9fe0ff;
    --edificio: #2e2050;
    --edificio2: #3f2c63;
    --suelo: #2a2540;
    --suelo2: #191527;
    --linea: #ffcf6b;
    --robot: #6fd7ff;
    --robot2: #2a9fd6;
    --robot3: #e6f9ff;
    --robotDark: #0f2a40;
    --tuerca: #ffb545;
    --tuerca2: #ff8a2b;
    --tuerca3: #fff0c2;
    --oro: #ffd93b;
    --oro2: #ff9d00;
    --oro3: #fff6b0;
    --malo: #ff5a6e;
    --malo2: #a81733;
    --malo3: #ffb3bd;
    --ok: #3ee88f;
    --aviso: #ffd23f;
    --texto: #f2f7ff;
    --texto2: #9fb0d0;
    --panel: #141f38;
    --panel2: #26375e;
    --marco: #7f8db3;
    --marco2: #39476b;
    --fondo: #241238;
    --sombra: rgba(0, 0, 0, .5);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --cielo1: #04081c;
      --cielo2: #131a3d;
      --cielo3: #4a2f4e;
      --sol: #eaf1ff;
      --solHalo: #7fa8ff;
      --estrella: 1;
      --nube: #3b3560;
      --montana: #1c1e40;
      --montana2: #13152c;
      --ciudad: #101430;
      --ventana: #ffcf7a;
      --ventana2: #8fd8ff;
      --edificio: #0b0e22;
      --edificio2: #171d3a;
      --suelo: #141228;
      --suelo2: #090812;
      --linea: #ffcf6b;
      --panel: #0d1730;
      --panel2: #1d2c4e;
      --marco: #66739a;
      --marco2: #2b3757;
      --fondo: #05060f;
    }
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; min-height: 100%; }

  body {
    background:
      radial-gradient(120% 90% at 50% -10%, rgba(255, 159, 90, .18), transparent 60%),
      radial-gradient(100% 80% at 50% 120%, rgba(110, 215, 255, .14), transparent 60%),
      var(--fondo);
    color: var(--texto);
    font-family: "Baloo 2", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    min-height: 100dvh;
    padding: calc(12px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
  }

  canvas {
    width: min(96vw, 1200px, 156vh);
    max-height: 78vh;
    aspect-ratio: 2 / 1;
    display: block;
    border-radius: 20px;
    background: var(--cielo1);
    box-shadow: 0 22px 55px var(--sombra), 0 0 0 3px rgba(255, 255, 255, .07), 0 0 0 1px rgba(0, 0, 0, .5);
    touch-action: none;
    cursor: pointer;
  }

  .controls {
    width: min(96vw, 1200px);
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
  }

  .controls button {
    font: 800 17px "Baloo 2", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    letter-spacing: .3px;
    padding: 13px 22px;
    border: none;
    border-radius: 16px;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    cursor: pointer;
    transition: transform .06s ease, box-shadow .06s ease, filter .12s ease;
  }

  #crouchBtn {
    min-width: 230px;
    color: #2a1400;
    background: linear-gradient(180deg, #ffe79a 0%, #ffc257 45%, #ff8f2e 100%);
    box-shadow:
      0 6px 0 #a8560f,
      0 12px 24px rgba(0, 0, 0, .35),
      inset 0 2px 0 rgba(255, 255, 255, .85),
      inset 0 -3px 0 rgba(160, 70, 0, .35);
  }

  #pauseBtn {
    min-width: 150px;
    color: #05243a;
    background: linear-gradient(180deg, #bff1ff 0%, #7fd4ff 45%, #35a3d8 100%);
    box-shadow:
      0 6px 0 #1a6c93,
      0 12px 24px rgba(0, 0, 0, .35),
      inset 0 2px 0 rgba(255, 255, 255, .85),
      inset 0 -3px 0 rgba(0, 60, 90, .3);
  }

  #restartBtn {
    min-width: 150px;
    color: #f2f7ff;
    background: linear-gradient(180deg, #8b9bc4 0%, #5b6b93 45%, #3c4a6e 100%);
    box-shadow:
      0 6px 0 #202a44,
      0 12px 24px rgba(0, 0, 0, .35),
      inset 0 2px 0 rgba(255, 255, 255, .45),
      inset 0 -3px 0 rgba(0, 0, 0, .3);
  }

  .controls button:active,
  .controls button.on {
    transform: translateY(5px);
    filter: saturate(1.15) brightness(1.05);
    box-shadow: 0 1px 0 rgba(0, 0, 0, .45), 0 4px 10px rgba(0, 0, 0, .35), inset 0 2px 0 rgba(255, 255, 255, .6);
  }

  .help {
    width: min(96vw, 1200px);
    margin: 0;
    font-size: 14px;
    line-height: 1.45;
    text-align: center;
    color: var(--texto2);
  }
</style>
</head>
<body>
  <canvas id="game" width="800" height="400"></canvas>

  <div class="controls">
    <button id="crouchBtn" type="button">⬇ Agacharse (S)</button>
    <button id="pauseBtn" type="button">⏸ Pausa</button>
    <button id="restartBtn" type="button">🔄 Reiniciar</button>
  </div>

  <p class="help">
    Espacio / toque = saltar (doble salto) · S = agacharse (también ↓ o el botón).
    P = pausa (o Esc) · R = reiniciar. Bajo las chispas hay tuercas. Si se apagan las luces,
    las tuercas encienden la linterna.
  </p>

<script>
(function () {
  'use strict';

  /* ================= SETUP ================= */

  var cv = document.getElementById('game');
  var ctx = cv.getContext('2d');
  var pauseBtn = document.getElementById('pauseBtn');
  var restartBtn = document.getElementById('restartBtn');
  var W = 800, H = 400, G = 330;

  var DPR = Math.min(window.devicePixelRatio || 1, 2);
  var LDPR = Math.min(DPR, 1.75);
  cv.width = W * DPR;
  cv.height = H * DPR;

  var dark = document.createElement('canvas');
  dark.width = W * DPR;
  dark.height = H * DPR;
  var dctx = dark.getContext('2d');

  var F_TITLE = '"Russo One", system-ui, sans-serif';
  var F_BODY = '"Baloo 2", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';

  /* ================= COLORS ================= */

  var col = {};
  var num = {};
  var rgbaCache = {};

  function readColors() {
    var cs = getComputedStyle(document.documentElement);
    function g(n) { return cs.getPropertyValue(n).trim(); }
    col = {
      cielo1: g('--cielo1'), cielo2: g('--cielo2'), cielo3: g('--cielo3'),
      sol: g('--sol'), solHalo: g('--solHalo'), nube: g('--nube'),
      montana: g('--montana'), montana2: g('--montana2'),
      ciudad: g('--ciudad'), ventana: g('--ventana'), ventana2: g('--ventana2'),
      edificio: g('--edificio'), edificio2: g('--edificio2'),
      suelo: g('--suelo'), suelo2: g('--suelo2'), linea: g('--linea'),
      robot: g('--robot'), robot2: g('--robot2'), robot3: g('--robot3'), robotDark: g('--robotDark'),
      tuerca: g('--tuerca'), tuerca2: g('--tuerca2'), tuerca3: g('--tuerca3'),
      oro: g('--oro'), oro2: g('--oro2'), oro3: g('--oro3'),
      malo: g('--malo'), malo2: g('--malo2'), malo3: g('--malo3'),
      ok: g('--ok'), aviso: g('--aviso'),
      texto: g('--texto'), texto2: g('--texto2'),
      panel: g('--panel'), panel2: g('--panel2'),
      marco: g('--marco'), marco2: g('--marco2')
    };
    num.estrella = parseFloat(g('--estrella')) || 0;
    rgbaCache = {};
  }

  function rgba(hex, a) {
    if (!hex) return 'rgba(0,0,0,' + a + ')';
    var h = hex.replace('#', '');
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    var v = parseInt(h, 16);
    if (isNaN(v)) return 'rgba(0,0,0,' + a + ')';
    return 'rgba(' + ((v >> 16) & 255) + ',' + ((v >> 8) & 255) + ',' + (v & 255) + ',' + a + ')';
  }

  function C(name, a) {
    var k = name + '|' + a;
    var v = rgbaCache[k];
    if (v === undefined) { v = rgba(col[name], a); rgbaCache[k] = v; }
    return v;
  }

  /* ================= HELPERS ================= */

  function roundRect(c, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    if (r < 0) r = 0;
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  function hexPath(c, x, y, r, rot) {
    c.beginPath();
    for (var i = 0; i < 6; i++) {
      var a = rot + i * Math.PI / 3;
      var px = x + Math.cos(a) * r;
      var py = y + Math.sin(a) * r;
      if (i) c.lineTo(px, py);
      else c.moveTo(px, py);
    }
    c.closePath();
  }

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, k) { return a + (b - a) * k; }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function aabb(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  function mkCanvas(w, h, dpr) {
    var c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(w * dpr));
    c.height = Math.max(1, Math.round(h * dpr));
    var g = c.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    c._w = w; c._h = h;
    return c;
  }

  function rivet(g, x, y, r, light, darkc) {
    g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2);
    g.fillStyle = light; g.fill();
    g.beginPath(); g.arc(x + r * .3, y + r * .3, r * .55, 0, Math.PI * 2);
    g.fillStyle = darkc; g.fill();
  }

  /* ================= PHRASES ================= */

  var jumpPhrases = [
    'You can jump it!',
    'You should jump!',
    'You must keep going!',
    'You could do it!',
    'You will make it!',
    'You might jump twice!',
    'You can dodge this!'
  ];

  var duckPhrases = [
    'You should duck! (S)',
    'You can crouch!',
    'You must duck now!',
    'You could crouch low!',
    'You will duck it!',
    'You might crouch here!',
    'You can slide under!'
  ];

  /* ================= QUESTION BANK ================= */

  var questionBank = [
    { q: 'I ___ swim when I was five.', ok: 'could', no: 'must' },
    { q: 'She ___ speak three languages.', ok: 'can', no: 'must' },
    { q: 'You ___ stop at a red light.', ok: 'must', no: 'might' },
    { q: '___ I open the window, please?', ok: 'May', no: 'Must' },
    { q: 'It ___ rain tomorrow, so take an umbrella.', ok: 'might', no: 'must' },
    { q: 'You ___ smoke here. It is forbidden.', ok: 'must not', no: 'can' },
    { q: 'You ___ tell lies. It is wrong.', ok: 'should not', no: 'can' },
    { q: '___ you help me, please?', ok: 'Could', no: 'Must' },
    { q: 'A robot ___ fix itself with nuts.', ok: 'can', no: 'must not' },
    { q: 'We ___ hurry or we will miss the bus.', ok: 'should', no: 'could' },
    { q: 'He ___ be at home, but I am not sure.', ok: 'might', no: 'must' },
    { q: 'You ___ wear a helmet when you ride.', ok: 'should', no: 'might' },
    { q: '___ you pass me the wrench, please?', ok: 'Would', no: 'Must' },
    { q: 'Students ___ be quiet in the library.', ok: 'must', no: 'could' },
    { q: 'I ___ run very fast when I was young.', ok: 'could', no: 'may' },
    { q: 'It is late, so I ___ go home now.', ok: 'should', no: 'can' },
    { q: 'Robots ___ work all day without resting.', ok: 'can', no: 'must not' },
    { q: 'You ___ touch that wire! It is dangerous.', ok: 'must not', no: 'may' },
    { q: '___ I borrow your torch, please?', ok: 'May', no: 'Must' },
    { q: 'She ___ arrive later, the traffic is bad.', ok: 'might', no: 'must' }
  ];

  /* ================= GAME STATE (sin cambios) ================= */

  var state = 'menu';
  var t = 0;
  var last = 0;

  var robot = { x: 110, y: G, vy: 0, onGround: true, jumps: 0, crouch: false, crouchHeld: false, invuln: 0 };

  var integrity = 70;
  var speed = 190;
  var distance = 0;
  var worldScroll = 0;
  var distToNext = 300;
  var elapsed = 0;
  var score = 0;
  var nuts = 0;
  var goldenNuts = 0;
  var questionBonus = 0;
  var obstaclesSinceGate = 0;
  var correctCount = 0;
  var wrongCount = 0;
  var paused = false;

  var shake = 0;
  var obstacles = [];
  var nutList = [];
  var particles = [];

  var darkLevel = 0;
  var flashCharge = 0;
  var flashOn = false;

  var best = 0;
  try { best = parseInt(localStorage.getItem('roborunner_best') || '0', 10) || 0; } catch (e) { best = 0; }

  /* ================= VISUAL STATE ================= */

  var sqX = 1, sqY = 1;
  var runPhase = 0;
  var prevOnGround = true;
  var dust = [];
  var floaters = [];
  var smoke = [];
  var dustAcc = 0;
  var sparkAcc = 0;
  var repairFlash = 0;
  var hurtFlash = 0;
  var clickFx = 0;
  var prevFlashOn = false;
  var fade = 0;
  var prevState = 'menu';
  var newRecord = false;
  var scorePulse = 0;
  var prevScore = 0;
  var barLag = 70;
  var nutPulse = 0;
  var flashLowPulse = 0;
  var winA = 1, winB = 1;

  var beamMotes = [];
  for (var bm = 0; bm < 26; bm++) {
    beamMotes.push({
      a: (Math.random() - 0.5) * 0.56,
      d: 30 + Math.random() * 340,
      sp: 20 + Math.random() * 60,
      s: 0.6 + Math.random() * 1.6,
      ph: Math.random() * Math.PI * 2
    });
  }

  var gearA = { x: 118, y: 296, r: 46, sp: 0.25 };
  var gearB = { x: 690, y: 288, r: 32, sp: -0.4 };

  var antennas = [
    { x: 96, y: G - 168, ph: 0 },
    { x: 372, y: G - 150, ph: 2.1 },
    { x: 604, y: G - 182, ph: 4.2 }
  ];

  var chimneys = [
    { x: 210, y: G - 132 },
    { x: 500, y: G - 156 },
    { x: 742, y: G - 118 }
  ];
  var smokeAcc = [0, 0, 0];

  /* ================= SPRITES & LAYERS ================= */

  var S = {};
  var L = {};
  var grads = {};

  function buildNutSprite(r, c1, c2, c3, rim) {
    var s = r * 2 + 12;
    var c = mkCanvas(s, s, DPR);
    var g = c.getContext('2d');
    var cx = s / 2, cy = s / 2;

    g.save();
    g.shadowColor = 'rgba(0,0,0,0.45)';
    g.shadowBlur = 6;
    g.shadowOffsetY = 2;
    hexPath(g, cx, cy, r, 0);
    g.fillStyle = c2;
    g.fill();
    g.restore();

    hexPath(g, cx, cy, r, 0);
    var lg = g.createLinearGradient(cx - r, cy - r, cx + r * .8, cy + r);
    lg.addColorStop(0, c1);
    lg.addColorStop(0.42, c2);
    lg.addColorStop(1, c3);
    g.fillStyle = lg;
    g.fill();
    g.strokeStyle = rim;
    g.lineWidth = 2;
    g.stroke();

    hexPath(g, cx, cy, r * 0.74, 0);
    g.strokeStyle = 'rgba(255,255,255,0.5)';
    g.lineWidth = 1.6;
    g.stroke();

    g.beginPath();
    g.arc(cx, cy, r * 0.34, 0, Math.PI * 2);
    g.fillStyle = 'rgba(8,10,20,0.55)';
    g.fill();
    g.strokeStyle = 'rgba(255,255,255,0.4)';
    g.lineWidth = 1.4;
    g.stroke();

    return c;
  }

  function buildShineFrames(r, n) {
    var s = r * 2 + 12;
    var out = [];
    for (var i = 0; i < n; i++) {
      var c = mkCanvas(s, s, DPR);
      var g = c.getContext('2d');
      var cx = s / 2, cy = s / 2;
      g.save();
      hexPath(g, cx, cy, r, 0);
      g.clip();
      var p = i / n;
      var bx = cx - r * 1.6 + p * r * 3.2;
      var lg = g.createLinearGradient(bx - r * .55, cy - r, bx + r * .55, cy + r);
      lg.addColorStop(0, 'rgba(255,255,255,0)');
      lg.addColorStop(0.5, 'rgba(255,255,255,0.92)');
      lg.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = lg;
      g.fillRect(0, 0, s, s);
      g.restore();
      out.push(c);
    }
    return out;
  }

  function buildGlowSprite(r, color, inner) {
    var s = r * 2;
    var c = mkCanvas(s, s, DPR);
    var g = c.getContext('2d');
    var rg = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
    rg.addColorStop(0, inner);
    rg.addColorStop(0.35, color);
    rg.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = rg;
    g.fillRect(0, 0, s, s);
    return c;
  }

  function buildBoxSprite(w, h) {
    var pad = 10;
    var c = mkCanvas(w + pad * 2, h + pad * 2, DPR);
    var g = c.getContext('2d');
    var x = pad, y = pad;

    roundRect(g, x, y, w, h, 7);
    var lg = g.createLinearGradient(x, y, x + w, y + h);
    lg.addColorStop(0, col.malo3);
    lg.addColorStop(0.35, col.malo);
    lg.addColorStop(1, col.malo2);
    g.fillStyle = lg;
    g.fill();
    g.strokeStyle = 'rgba(0,0,0,0.45)';
    g.lineWidth = 3;
    g.stroke();

    roundRect(g, x + 4, y + 4, w - 8, h - 8, 5);
    g.strokeStyle = 'rgba(255,255,255,0.35)';
    g.lineWidth = 2;
    g.stroke();

    g.strokeStyle = 'rgba(20,10,20,0.55)';
    g.lineWidth = 7;
    g.lineCap = 'round';
    g.beginPath();
    g.moveTo(x + 10, y + 10);
    g.lineTo(x + w - 10, y + h - 10);
    g.moveTo(x + w - 10, y + 10);
    g.lineTo(x + 10, y + h - 10);
    g.stroke();

    g.strokeStyle = 'rgba(255,255,255,0.55)';
    g.lineWidth = 3;
    g.beginPath();
    g.moveTo(x + 10, y + 10);
    g.lineTo(x + w - 10, y + h - 10);
    g.moveTo(x + w - 10, y + 10);
    g.lineTo(x + 10, y + h - 10);
    g.stroke();

    var pts = [[9, 9], [w - 9, 9], [9, h - 9], [w - 9, h - 9]];
    for (var i = 0; i < pts.length; i++) {
      rivet(g, x + pts[i][0], y + pts[i][1], 2.6, 'rgba(255,235,235,0.9)', 'rgba(60,10,20,0.6)');
    }
    return c;
  }

  function buildPuddleSprite() {
    var w = 100, h = 30;
    var c = mkCanvas(w, h, DPR);
    var g = c.getContext('2d');
    g.beginPath();
    g.ellipse(w / 2, h / 2, 42, 11, 0, 0, Math.PI * 2);
    var lg = g.createRadialGradient(w / 2, h / 2 - 3, 2, w / 2, h / 2, 44);
    lg.addColorStop(0, 'rgba(44,22,76,0.95)');
    lg.addColorStop(0.6, 'rgba(14,10,26,0.95)');
    lg.addColorStop(1, 'rgba(6,4,14,0.95)');
    g.fillStyle = lg;
    g.fill();
    g.strokeStyle = 'rgba(150,110,220,0.35)';
    g.lineWidth = 2;
    g.stroke();
    return c;
  }

  function buildSparkSprite() {
    var w = 60, h = 66;
    var c = mkCanvas(w + 8, h + 8, DPR);
    var g = c.getContext('2d');
    var x = 4, y = 4;

    roundRect(g, x, y, w, h, 11);
    var lg = g.createLinearGradient(x, y, x + w, y + h);
    lg.addColorStop(0, '#4a5578');
    lg.addColorStop(0.45, '#2b3550');
    lg.addColorStop(1, '#151b2e');
    g.fillStyle = lg;
    g.fill();
    g.strokeStyle = 'rgba(0,0,0,0.5)';
    g.lineWidth = 3;
    g.stroke();

    roundRect(g, x + 5, y + 5, w - 10, h - 10, 8);
    g.strokeStyle = 'rgba(255,255,255,0.18)';
    g.lineWidth = 2;
    g.stroke();

    for (var i = 0; i < 6; i++) {
      rivet(g, x + 8 + (i % 2) * (w - 16), y + 8 + Math.floor(i / 2) * 25, 2.4, 'rgba(200,215,240,0.8)', 'rgba(0,0,0,0.45)');
    }
    return c;
  }

  function buildVignette() {
    var c = mkCanvas(W, H, 1);
